<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | University Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-shell wide"><a class="brand auth-brand" href="index.html"><span class="brand-mark">U</span><span><strong>University</strong><small>Enrollment Portal</small></span></a>
<div class="auth-card"><div class="auth-heading"><span class="eyebrow">NEW STUDENT</span><h1>Create your account</h1><p>Enter your information to access the enrollment portal.</p></div>
<form id="registerForm" novalidate>
<div class="form-section"><h3>Personal Information</h3><div class="form-grid three"><label>Student ID<input id="regStudentId" required placeholder="2026-0002"></label><label>First Name<input id="regFirstName" required></label><label>Middle Name<input id="regMiddleName"></label><label>Last Name<input id="regLastName" required></label><label>Date of Birth<input id="regDob" type="date" required></label><label>Gender<select id="regGender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label></div></div>
<div class="form-section"><h3>Contact Information</h3><div class="form-grid two"><label>Address<input id="regAddress" required></label><label>Phone<input id="regPhone" type="tel" required placeholder="+63 9XX XXX XXXX"></label><label>Email<input id="regEmail" type="email" required></label></div></div>
<div class="form-section"><h3>Account & Academic Information</h3><div class="form-grid three"><label>Course<select id="regCourse" required><option value="">Select course</option><option>BS Information Technology</option><option>BS Computer Science</option><option>BS Business Administration</option><option>BS Criminology</option><option>BS Education</option></select></label><label>Year Level<select id="regYear" required><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></label><label>Username<input id="regUsername" required></label><label>Password<div class="password-wrap"><input id="regPassword" type="password" required minlength="6"><button type="button" class="password-toggle" data-target="regPassword">Show</button></div></label><label>Confirm Password<div class="password-wrap"><input id="regConfirm" type="password" required><button type="button" class="password-toggle" data-target="regConfirm">Show</button></div></label></div></div>
<div id="registerMessage" class="form-message hidden"></div><button class="btn btn-primary btn-full" type="submit">Create Student Account</button></form><p class="auth-bottom">Already registered? <a href="login.html">Sign in</a></p></div></div>
<script src="js/auth.js"></script></body></html>
